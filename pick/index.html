<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pick your photos | Stylezz by Kam</title>
<style>
:root {
  --paper: #FFF8F1;
  --ink: #111111;
  --muted: #55504a;
  --coral: #FF4B3E;
  --green: #00A86B;
  --line: #111111;
  --card: #FFFFFF;
  --radius: 18px;
  --heading: "Avenir Next Condensed", "Futura", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 18px;
  line-height: 1.5;
  padding-bottom: 120px;
}
:focus-visible { outline: 4px solid var(--green); outline-offset: 3px; }
header.top {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 2px solid var(--line);
  background: var(--paper);
}
header.top img { width: 44px; height: 44px; border-radius: 10px; display: block; }
header.top .name { font-family: var(--heading); font-weight: 900; letter-spacing: 0.01em; text-transform: uppercase; font-size: 1.05rem; }
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 0; }
.stepline { font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.9rem; color: var(--muted); margin: 0 0 4px; }
h1 { font-family: var(--heading); font-weight: 900; font-size: clamp(1.9rem, 7vw, 2.8rem); line-height: 1.05; margin: 0 0 12px; }
.lead { margin: 0 0 18px; max-width: 40rem; }
.note { background: #E9F8F0; border: 2px solid var(--green); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-weight: 600; }
.warn { background: #FFE9E6; border: 2px solid var(--coral); border-radius: 12px; padding: 10px 14px; margin: 0 0 16px; font-weight: 700; }
[hidden] { display: none !important; }

/* photo grid */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0; margin: 0; list-style: none; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 960px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.tile {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: 3px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: #ddd;
  cursor: pointer;
  aspect-ratio: 3 / 4;
  font: inherit;
  -webkit-tap-highlight-color: transparent;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .label {
  position: absolute; left: 8px; bottom: 8px;
  background: rgba(17,17,17,0.82); color: #fff;
  font-weight: 800; font-size: 0.95rem;
  padding: 4px 10px; border-radius: 999px;
}
.tile .rank {
  position: absolute; right: 8px; top: 8px;
  min-width: 48px; height: 48px; padding: 0 8px;
  display: none; align-items: center; justify-content: center;
  background: var(--coral); color: #fff;
  border: 3px solid #fff; border-radius: 999px;
  font-family: var(--heading); font-weight: 900; font-size: 1.5rem;
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.tile[aria-pressed="true"] { border-color: var(--coral); box-shadow: 0 0 0 4px var(--coral); }
.tile[aria-pressed="true"] .rank { display: flex; }
.tile[aria-pressed="true"] img { opacity: 0.92; }

/* step 2 list */
.picklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.pickrow {
  display: grid;
  grid-template-columns: 96px 1fr;
  gap: 14px;
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
}
.pickrow .thumb { position: relative; width: 96px; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; border: 2px solid var(--line); }
.pickrow .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pickrow .place {
  position: absolute; left: 6px; top: 6px;
  background: var(--coral); color: #fff; border: 2px solid #fff;
  min-width: 32px; height: 32px; border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--heading); font-weight: 900;
}
.pickrow .info { display: grid; gap: 10px; align-content: start; min-width: 0; }
.pickrow .which { font-weight: 800; }
select {
  width: 100%; min-height: 52px;
  font: inherit; font-weight: 600;
  padding: 10px 12px;
  border: 3px solid var(--line); border-radius: 14px;
  background: #fff; color: var(--ink);
}
select.todo { border-color: var(--coral); background: #FFF3F1; }
.move { display: flex; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 52px; padding: 10px 22px;
  border: 3px solid var(--line); border-radius: 999px;
  font: inherit; font-weight: 800; letter-spacing: 0.02em;
  background: #fff; color: var(--ink); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn.small { min-height: 48px; padding: 8px 16px; }
.btn.primary { background: var(--coral); }
.btn.green { background: var(--green); }
.btn.dark { background: var(--ink); color: #fff; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.wide { width: 100%; }

/* step 3 */
.summary { list-style: none; margin: 0 0 20px; padding: 0; border: 3px solid var(--line); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.summary li { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 2px solid var(--line); }
.summary li:first-child { border-top: 0; }
.summary .n { font-family: var(--heading); font-weight: 900; font-size: 1.3rem; min-width: 2ch; }
.summary img { width: 44px; height: 58px; object-fit: cover; border-radius: 8px; border: 2px solid var(--line); }
.summary .t { font-weight: 700; }
.summary .p { color: var(--muted); font-size: 0.95rem; font-weight: 600; }
.actions { display: grid; gap: 12px; margin-bottom: 18px; }
textarea.snap { width: 100%; min-height: 220px; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 12px; border: 3px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); }

/* bottom bar */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--ink); color: #fff;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex; gap: 12px; align-items: center; justify-content: space-between;
}
.bar .count { font-weight: 800; font-size: 1.05rem; }
.bar .count small { display: block; font-weight: 600; color: #d6d0c9; font-size: 0.85rem; }
.bar .btn { border-color: #fff; }
.bar .group { display: flex; gap: 10px; }

.footer { max-width: 960px; margin: 30px auto 0; padding: 0 16px; color: var(--muted); font-size: 0.95rem; }
.linkbtn { background: none; border: 0; padding: 12px 0; font: inherit; font-weight: 700; color: var(--muted); text-decoration: underline; cursor: pointer; min-height: 44px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: no-preference) { .tile, .btn { transition: transform .08s ease; } .tile:active, .btn:active { transform: scale(0.98); } }
</style>
</head>
<body>
<header class="top">
  <img src="../assets/logo.png" alt="" width="44" height="44">
  <span class="name">Stylezz by Kam</span>
</header>

<main id="app" aria-live="polite"></main>

<div class="footer">
  <button class="linkbtn" id="reset" type="button">Start over</button>
  <p>Your picks are saved on this phone while you work. Nothing is sent until you press the Send button at the end.</p>
</div>

<div class="bar" id="bar"></div>

<script>
// ---- Settings (edit here) ----
const MAX_PICKS = 12;
const SEND_TO_NAME = "Dre";
const SNAPSHOT_TITLE = "STYLEZZ PICKS v1";
const PHOTO_COUNT = 20;
const THUMB_PATH = "../assets/thumbs/";
const STORAGE_KEY = "stylezz-picks-v1";
const STYLES = [
  "Box braids", "Knotless braids", "Fulani braids", "Stitch braids", "Boho braids",
  "Cornrows", "Crochet", "Jada Wada styles", "Single braids / twists", "Natural styles",
  "Locs retwist", "Locs styling", "Kids braids", "Male braids",
  "Wig installation", "Wash and blow dry", "Takedown services", "Other or not sure"
];

// ---- State ----
let state = { picks: [], tags: {}, step: 1 };
let restored = false;
let message = "";
let confirmReset = false;
let showFallback = false;
let sentOk = false;

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.picks)) {
      state.picks = s.picks.filter(n => Number.isInteger(n) && n >= 1 && n <= PHOTO_COUNT).slice(0, MAX_PICKS);
      state.tags = {};
      Object.keys(s.tags || {}).forEach(k => { if (STYLES.includes(s.tags[k]) && state.picks.includes(Number(k))) state.tags[k] = s.tags[k]; });
      state.step = [1, 2, 3].includes(s.step) ? s.step : 1;
      if (state.picks.length === 0) state.step = 1;
      restored = state.picks.length > 0;
    }
  } catch (e) { /* storage unavailable, keep going */ }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

// ---- Helpers ----
const pad = n => String(n).padStart(2, "0");
const thumb = n => THUMB_PATH + "photo-" + pad(n) + ".jpg";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const untagged = () => state.picks.filter(n => !state.tags[n]);
function snapshot() {
  const lines = [SNAPSHOT_TITLE];
  state.picks.forEach((n, i) => lines.push((i + 1) + ". photo-" + pad(n) + " | " + (state.tags[n] || "No style chosen")));
  return lines.join("\n");
}

// ---- Rendering ----
const app = document.getElementById("app");
const bar = document.getElementById("bar");

function renderStep1() {
  const tiles = [];
  for (let n = 1; n <= PHOTO_COUNT; n++) {
    const idx = state.picks.indexOf(n);
    const picked = idx !== -1;
    const aria = "Photo " + n + (picked ? ", picked as number " + (idx + 1) + ". Tap to remove." : ". Tap to pick.");
    tiles.push(
      '<li><button type="button" class="tile" data-photo="' + n + '" aria-pressed="' + picked + '" aria-label="' + aria + '">' +
      '<img src="' + thumb(n) + '" alt="" width="420" height="560" loading="lazy">' +
      '<span class="label">Photo ' + n + '</span>' +
      '<span class="rank" aria-hidden="true">' + (picked ? idx + 1 : "") + '</span>' +
      '</button></li>'
    );
  }
  app.innerHTML =
    '<p class="stepline">Step 1 of 3</p>' +
    '<h1>Tap your best photos</h1>' +
    '<p class="lead">Tap the photos you want on your website, in the order you want them to show. The number on a photo is its place in the line. Tap a picked photo again to take it off. You can pick up to ' + MAX_PICKS + '.</p>' +
    (restored ? '<p class="note">Welcome back. Your picks were saved on this phone.</p>' : '') +
    (message ? '<p class="warn" role="alert">' + esc(message) + '</p>' : '') +
    '<ul class="grid">' + tiles.join("") + '</ul>';
  const c = state.picks.length;
  bar.innerHTML =
    '<div class="count">' + c + ' of ' + MAX_PICKS + ' picked<small>' + (c === 0 ? "Tap a photo to start" : "Order matters") + '</small></div>' +
    '<button type="button" class="btn primary" id="next1"' + (c === 0 ? " disabled" : "") + '>Next</button>';
}

function renderStep2() {
  const rows = state.picks.map((n, i) => {
    const tag = state.tags[n] || "";
    const opts = ['<option value=""' + (tag ? "" : " selected") + '>Choose a style</option>']
      .concat(STYLES.map(s => '<option value="' + esc(s) + '"' + (s === tag ? " selected" : "") + '>' + esc(s) + '</option>')).join("");
    return '<li class="pickrow">' +
      '<div class="thumb"><img src="' + thumb(n) + '" alt="Photo ' + n + '" width="420" height="560"><span class="place" aria-hidden="true">' + (i + 1) + '</span></div>' +
      '<div class="info">' +
        '<div class="which">Place ' + (i + 1) + ' (Photo ' + n + ')</div>' +
        '<label class="sr" for="sel' + n + '">Style for photo ' + n + '</label>' +
        '<select id="sel' + n + '" data-photo="' + n + '" class="' + (tag ? "" : "todo") + '">' + opts + '</select>' +
        '<div class="move">' +
          '<button type="button" class="btn small" data-move="up" data-photo="' + n + '"' + (i === 0 ? " disabled" : "") + ' aria-label="Move photo ' + n + ' up">Move up</button>' +
          '<button type="button" class="btn small" data-move="down" data-photo="' + n + '"' + (i === state.picks.length - 1 ? " disabled" : "") + ' aria-label="Move photo ' + n + ' down">Move down</button>' +
        '</div>' +
      '</div></li>';
  }).join("");
  app.innerHTML =
    '<p class="stepline">Step 2 of 3</p>' +
    '<h1>What style is each one?</h1>' +
    '<p class="lead">Choose the style for each photo. Pick the closest one. If you are not sure, choose "Other or not sure". Use Move up and Move down if you want to change the order.</p>' +
    '<ul class="picklist">' + rows + '</ul>';
  const left = untagged().length;
  bar.innerHTML =
    '<button type="button" class="btn" id="back2">Back</button>' +
    '<div class="count">' + (left === 0 ? "All styles chosen" : left + " left to choose") + '</div>' +
    '<button type="button" class="btn primary" id="next2"' + (left > 0 ? " disabled" : "") + '>Next</button>';
}

function renderStep3() {
  const items = state.picks.map((n, i) =>
    '<li><span class="n">' + (i + 1) + '</span><img src="' + thumb(n) + '" alt="" width="44" height="58"><div><div class="t">' + esc(state.tags[n] || "No style chosen") + '</div><div class="p">Photo ' + n + '</div></div></li>'
  ).join("");
  app.innerHTML =
    '<p class="stepline">Step 3 of 3</p>' +
    '<h1>Check and send</h1>' +
    '<p class="lead">This is your list, in order. If it looks right, press the Send button and choose WhatsApp, then choose ' + esc(SEND_TO_NAME) + '. If something is wrong, press Back.</p>' +
    '<ol class="summary">' + items + '</ol>' +
    '<div class="actions">' +
      '<button type="button" class="btn green wide" id="send">Send to ' + esc(SEND_TO_NAME) + '</button>' +
      '<button type="button" class="btn wide" id="copy">Copy instead</button>' +
    '</div>' +
    (sentOk ? '<p class="note" role="status">Done. Thank you. If you change your mind, press Back, make the change, and send again.</p>' : '') +
    (message ? '<p class="note" role="status">' + esc(message) + '</p>' : '') +
    (showFallback ? '<p class="lead">If sending did not open, copy this text and paste it in WhatsApp to ' + esc(SEND_TO_NAME) + '.</p><textarea class="snap" id="snap" readonly>' + esc(snapshot()) + '</textarea>' : '');
  bar.innerHTML = '<button type="button" class="btn" id="back3">Back</button><div class="count">' + state.picks.length + ' photos</div><span></span>';
}

function render() {
  if (state.step === 1) renderStep1();
  else if (state.step === 2) renderStep2();
  else renderStep3();
  const resetBtn = document.getElementById("reset");
  resetBtn.textContent = confirmReset ? "Tap again to clear everything" : "Start over";
}

function go(step) {
  state.step = step; message = ""; showFallback = false; sentOk = false; restored = false;
  save(); render(); window.scrollTo(0, 0);
}

// ---- Events ----
app.addEventListener("click", e => {
  const tile = e.target.closest(".tile");
  if (tile) {
    const n = Number(tile.dataset.photo);
    const idx = state.picks.indexOf(n);
    restored = false;
    if (idx !== -1) { state.picks.splice(idx, 1); delete state.tags[n]; message = ""; }
    else if (state.picks.length >= MAX_PICKS) { message = "That is " + MAX_PICKS + " photos. Tap one you picked to take it off first."; }
    else { state.picks.push(n); message = ""; }
    save();
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    if (message) { app.querySelector(".warn").scrollIntoView({ block: "nearest" }); }
    return;
  }
  const mv = e.target.closest("[data-move]");
  if (mv) {
    const n = Number(mv.dataset.photo);
    const i = state.picks.indexOf(n);
    const j = mv.dataset.move === "up" ? i - 1 : i + 1;
    if (i !== -1 && j >= 0 && j < state.picks.length) {
      [state.picks[i], state.picks[j]] = [state.picks[j], state.picks[i]];
      save(); const y = window.scrollY; render(); window.scrollTo(0, y);
      const again = app.querySelector('[data-move="' + mv.dataset.move + '"][data-photo="' + n + '"]');
      if (again && !again.disabled) again.focus();
    }
    return;
  }
  if (e.target.id === "send") sendIt();
  if (e.target.id === "copy") copyIt();
});
app.addEventListener("change", e => {
  if (e.target.matches("select[data-photo]")) {
    const n = Number(e.target.dataset.photo);
    if (e.target.value) state.tags[n] = e.target.value; else delete state.tags[n];
    save();
    e.target.classList.toggle("todo", !e.target.value);
    const left = untagged().length;
    bar.querySelector(".count").textContent = left === 0 ? "All styles chosen" : left + " left to choose";
    const nx = document.getElementById("next2");
    if (nx) nx.disabled = left > 0;
  }
});
bar.addEventListener("click", e => {
  const id = e.target.id;
  if (id === "next1" && state.picks.length > 0) go(2);
  else if (id === "back2") go(1);
  else if (id === "next2" && untagged().length === 0) go(3);
  else if (id === "back3") go(2);
});
document.getElementById("reset").addEventListener("click", () => {
  if (!confirmReset) { confirmReset = true; render(); return; }
  state = { picks: [], tags: {}, step: 1 };
  confirmReset = false; message = ""; showFallback = false; sentOk = false; restored = false;
  save(); render(); window.scrollTo(0, 0);
});

async function sendIt() {
  const text = snapshot();
  message = ""; sentOk = false;
  if (navigator.share) {
    try {
      await navigator.share({ title: "My Stylezz picks", text: text });
      sentOk = true; showFallback = false; render(); return;
    } catch (err) {
      if (err && err.name === "AbortError") { return; }
    }
  }
  showFallback = true; render();
  const ta = document.getElementById("snap"); if (ta) ta.scrollIntoView({ block: "center" });
}
async function copyIt() {
  const text = snapshot();
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) { ok = false; }
  showFallback = true; sentOk = false;
  message = ok ? "Copied. Now open WhatsApp and paste it to " + SEND_TO_NAME + "." : "Select the text below, copy it, and paste it in WhatsApp to " + SEND_TO_NAME + ".";
  render();
  const ta = document.getElementById("snap");
  if (ta) { ta.focus(); ta.select(); }
}

load();
render();
</script>
</body>
</html>
