name: Sync from Airtable

# Pulls prices, hours, text and photos from the Airtable base and rewrites the
# generated parts of index.html. Commits only when something changed.
# Needs the repo secret AIRTABLE_TOKEN (read-only token for the Stylezz base).

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
    inputs:
      force:
        description: "Accept a big drop in services, prices or photos (only if you removed them on purpose)"
        type: boolean
        default: false

concurrency:
  group: airtable-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # to raise (and later close) an alert when the sync stops

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Pull from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          SYNC_FORCE: ${{ inputs.force }}
        run: python3 scripts/sync_airtable.py

      - name: Commit changes
        id: commit
        run: |
          # GitHub switches off scheduled runs on a public repo after 60 days without
          # activity. Touch a small file once a month so a quiet period never does that.
          mkdir -p .github
          now=$(date -u +%s)
          last=$(date -u -d "$(cat .github/keepalive.txt 2>/dev/null || echo 2000-01-01)" +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then date -u +%F > .github/keepalive.txt; fi

          git add index.html assets/photos .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from Airtable"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # If the script stopped (Airtable changed or looks broken), the site keeps its last
      # good version. Raise one issue so someone hears about it; close it when a run works.
      - name: Raise an alert if the sync stopped
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --search '"Airtable sync stopped" in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Alert #$existing is already open."
          else
            gh issue create --title "Airtable sync stopped" \
              --body "The website was NOT updated and keeps showing its last good version. What went wrong is at the top of this run: $RUN_URL"
          fi

      - name: Close the alert once the sync works again
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --state open --search '"Airtable sync stopped" in:title' --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The sync is working again."
          fi
